org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# `android.enableJetifier` a été supprimé : inutile ici (aucune dépendance
# `com.android.support` dans l'arbre) et l'option est retirée par l'AGP 9.
# Ces deux options sont celles que les migrations de `flutter run` ajoutent
# d'elles-mêmes ; les écrire ici évite une modification automatique du fichier
# (elles ne sont lues qu'à partir de l'AGP 9).
android.newDsl=false
android.builtInKotlin=false
# Masque les deux avertissements de version du validateur Flutter
# (« Flutter support for your project's Gradle version (8.14.3) will soon be
# dropped… », idem pour l'AGP). C'est l'équivalent du drapeau
# `flutter run --android-skip-build-dependency-validation` : le validateur de
# Java / Gradle / AGP / Kotlin est sauté, tout le reste du build est inchangé.
# Les versions du projet sont juste au-dessus des minimums exigés par Flutter
# (voir docs/android-gradle.md) ; en cas d'échec Android après une mise à jour
# de Flutter, commenter cette ligne pour revoir les messages de version.
skipDependencyChecks=true
