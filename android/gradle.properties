org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# `android.enableJetifier` a été supprimé : inutile ici (aucune dépendance
# `com.android.support` dans l'arbre) et l'option est retirée par l'AGP 9.
# Ces deux options sont celles que les migrations de `flutter run` ajoutent
# d'elles-mêmes ; les écrire ici évite une modification automatique du fichier
# (elles ne sont lues qu'à partir de l'AGP 9).
android.newDsl=false
android.builtInKotlin=false
